services:
  social-coach:
    build: .
    container_name: social-coach
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      DATA_DIR: /data
      # 通过 HTTPS（Nginx/Caddy/云负载均衡）对外时务必打开这两项
      SECURE_COOKIES: "${SECURE_COOKIES:-0}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # 可选：配置后启用大模型模式，密钥只留在服务器
      LLM_ENDPOINT: "${LLM_ENDPOINT:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
    volumes:
      # 数据库文件目录：备份就是备份这个目录
      - ./data:/data
